
name: CI - Develop

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Añadir feature al README
        if: github.event_name == 'pull_request'
        env:
          FEATURE_BRANCH: ${{ github.head_ref }}
        run: |
          FEATURE_LINE="Añadida feature: $FEATURE_BRANCH"

          if grep -Fxq "$FEATURE_LINE" README.md; then
            echo "La feature ya existe en README.md"
          else
            echo "$FEATURE_LINE" >> README.md
            echo "Feature añadida correctamente"
          fi

      - name: Guardar cambios
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No hay cambios que guardar"
          else
            git commit -m "Actualizar README con nueva feature"
            git push origin HEAD:${{ github.head_ref }}
          fi

  validate-dev:
    needs: update-readme
    runs-on: self-hosted

    steps:
      - name: Validar token de desarrollo
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if [ "$DEV_TOKEN" = "$LOCAL_DEV_TOKEN" ]; then
            echo "Los tokens de desarrollo coinciden"
          else
            echo "Los tokens de desarrollo NO coinciden"
            exit 1
          fi

