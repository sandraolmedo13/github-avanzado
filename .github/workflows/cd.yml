
name: CD - Main

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Incrementar version en README
        run: |
          python3 - <<'PY'
          import re
          from datetime import datetime

          with open("README.md", "r") as f:
              content = f.read()

          match = re.search(r"AppVersion-(\d+)", content)

          if not match:
              raise SystemExit("No se encontro AppVersion en README.md")

          version = int(match.group(1)) + 1
          fecha = datetime.now().strftime("%Y-%m-%d %H:%M:%S")

          content = re.sub(
              r"AppVersion-\d+",
              f"AppVersion-{version} ({fecha})",
              content,
              count=1
          )

          with open("README.md", "w") as f:
              f.write(content)
          PY

      - name: Guardar nueva version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Incrementar version de la aplicacion" || exit 0
          git push

  validate-prod:
    needs: update-readme
    runs-on: self-hosted

    steps:
      - name: Validar token de produccion
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          if [ "$PROD_TOKEN" = "$LOCAL_PROD_TOKEN" ]; then
            echo "Los tokens de produccion coinciden"
          else
            echo "Los tokens de produccion NO coinciden"
            exit 1
          fi

